  <path d="M395 440c72 10 91 70 55 108-22 23-62 17-65-10-3-25 32-30 43-11 9-22-8-40-40-40" fill="none" stroke="#5d477d" stroke-width="25" stroke-linecap="round"/>
  <path d="M395 440c72 10 91 70 55 108-22 23-62 17-65-10-3-25 32-30 43-11" fill="none" stroke="#a477a5" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <!-- hair silhouette -->
  <path d="M130 218c-16-78 8-155 78-185 33-15 83-17 118 0 70 34 89 107 70 185l-13 114c-7 59-43 109-123 109s-116-50-123-109z" fill="url(#hair)" stroke="#342741" stroke-width="9"/>
  <!-- cat ears -->
  <path d="M146 134 102 30q-7-18 11-10l111 58z" fill="url(#ear)" stroke="#342741" stroke-width="9" stroke-linejoin="round"/>
  <path d="M374 134 418 30q7-18-11-10L296 78z" fill="url(#ear)" stroke="#342741" stroke-width="9" stroke-linejoin="round"/>
  <path d="M135 86 121 48l69 37zM385 86l14-38-69 37z" fill="#e9a9c8"/>
  <!-- face -->
  <path d="M156 196c0-83 43-128 104-128s104 45 104 128v76c0 86-49 131-104 131s-104-45-104-131z" fill="#f8d8c9" stroke="#342741" stroke-width="9"/>
  <!-- bangs -->
  <path d="M151 178c8-74 50-112 109-112 59 0 101 38 109 112-28-24-47-46-63-78-10 34-33 60-58 79-8-28-8-55-6-76-18 35-48 63-91 75z" fill="url(#hair)" stroke="#342741" stroke-width="8" stroke-linejoin="round"/>
  <!-- eyes -->
  <g>
    <ellipse cx="211" cy="225" rx="25" ry="34" fill="#6f57c8"/>
    <ellipse cx="309" cy="225" rx="25" ry="34" fill="#6f57c8"/>
    <ellipse cx="214" cy="222" rx="13" ry="20" fill="#9f86ed"/>
    <ellipse cx="312" cy="222" rx="13" ry="20" fill="#9f86ed"/>
    <circle cx="218" cy="211" r="8" fill="#fff"/>
    <circle cx="316" cy="211" r="8" fill="#fff"/>
    <circle cx="207" cy="239" r="4" fill="#fff" opacity=".8"/>
    <circle cx="305" cy="239" r="4" fill="#fff" opacity=".8"/>
    <path d="M181 187q29-25 59 0M279 187q30-25 59 0" fill="none" stroke="#49365e" stroke-width="9" stroke-linecap="round"/>
    <path d="M185 232q18 10 35 0M300 232q18 10 35 0" fill="none" stroke="#e99bb8" stroke-width="6" stroke-linecap="round" opacity=".65"/>
  </g>
  <!-- nose and smile -->
  <path d="M254 254q6-5 12 0" fill="none" stroke="#a85d78" stroke-width="5" stroke-linecap="round"/>
  <path d="M245 271q15 18 30 0" fill="none" stroke="#a85d78" stroke-width="6" stroke-linecap="round"/>
  <!-- hair side locks -->
  <path d="M157 258q-38 49-22 126 9 44 49 63l-7-100zM363 258q38 49 22 126-9 44-49 63l7-100z" fill="url(#hair)" stroke="#342741" stroke-width="8"/>
  <!-- neck -->
  <path d="M226 370v38q34 23 68 0v-38" fill="#f8d8c9" stroke="#342741" stroke-width="8"/>
  <!-- outfit -->
  <path d="M213 395q47 25 94 0l45 44q-17 61-35 107H203q-18-46-35-107z" fill="url(#dress)" stroke="#342741" stroke-width="9"/>
  <path d="M208 397q52 31 104 0l-15 55q-37 20-74 0z" fill="#fff" opacity=".92" stroke="#342741" stroke-width="7"/>
  <path d="M260 422v124" stroke="#6b55b7" stroke-width="7" opacity=".65"/>
  <path d="M189 469q71 27 142 0" fill="none" stroke="#f3c4df" stroke-width="8" opacity=".75"/>
  <!-- arms -->
  <path d="M176 438q-38 34-47 91" fill="none" stroke="#f8d8c9" stroke-width="27" stroke-linecap="round"/>
  <path d="M344 438q38 34 47 91" fill="none" stroke="#f8d8c9" stroke-width="27" stroke-linecap="round"/>
  <path d="M130 526q-13 7-25-1" fill="none" stroke="#f8d8c9" stroke-width="22" stroke-linecap="round"/>
  <path d="M390 526q13 7 25-1" fill="none" stroke="#f8d8c9" stroke-width="22" stroke-linecap="round"/>
  <!-- cat paws badge -->
  <g transform="translate(225 464)">
    <rect x="0" y="0" width="70" height="54" rx="18" fill="#fff" stroke="#765fd0" stroke-width="5"/>
    <path d="M35 18c-12-15-27 1-15 12 5 5 10 7 15 13 5-6 10-8 15-13 12-11-3-27-15-12z" fill="#e7a1c0"/>
  </g>
  <!-- lively floating accents -->
  <g fill="#8d76df">
    <circle cx="82" cy="196" r="6"><animate attributeName="cy" values="196;177;196" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="438" cy="230" r="6"><animate attributeName="cy" values="230;210;230" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <!-- blink -->
  <g opacity="0">
    <path d="M185 225q26 18 52 0M283 225q26 18 52 0" fill="none" stroke="#49365e" stroke-width="8" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="4.8s" repeatCount="indefinite"/>
    </path>
  </g>
</g>
</svg>