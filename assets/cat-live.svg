<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620">
<defs>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b477d"/><stop offset=".55" stop-color="#7b5b9b"/><stop offset="1" stop-color="#b37ba9"/></linearGradient>
  <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8d72dc"/><stop offset="1" stop-color="#c98fc3"/></linearGradient>
  <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6a4d82"/><stop offset="1" stop-color="#49365e"/></linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<ellipse cx="260" cy="575" rx="145" ry="22" fill="#6f5a9d" opacity=".16"><animate attributeName="rx" values="145;128;145" dur="3s" repeatCount="indefinite"/></ellipse>
<g>
